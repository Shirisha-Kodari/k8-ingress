apiVersion: apps/v1
kind: Deployment 
metadata:  
   name: app1  #this is deployment name       
   # deployment labels    
   labels:
     purpose: ingress
     project: roboshop
     app: app1
spec: 
  replicas: 2
  # these are the labels replica set use to create  pod replicas, this should match pod labels
  selector:
     matchLabels:
        purpose: ingress
        project: roboshop
        app: app1 
       # this is pod definition
  template: 
    metadata:
       labels:
         purpose: ingress
         project: roboshop
         app: app1
    spec: 
      containers:
      - name: app1
        image:  shirisha104/app1:v1 
---
apiVersion: v1
kind: Service 
metadata:
  name: app1
  labels: 
    purpose: ingress
    project: roboshop
    app: app1
spec:
  selector:
    purpose: ingress
    project: roboshop
    app: app1
  ports:
    - protocol: TCP
      port: 80 # service port
      targetPort: 80 # container port
---
# create ingress resource 
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app1
  annotations: #kubernets extra service 
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:547520640015:certificate/91fbd2da-98d5-4766-869e-dadce911b8fd
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip #traffic forward directly ip of pod
    alb.ingress.kubernetes.io/group.name: joindevops #we mention group so load balancer ingree worked on ,multiple rules app1.daws84s.cfdand app2.daws8s.cfd
spec:
  ingressClassName: alb
  rules:
  - host: "app1.kodari.online" # this is tesing purpose like application 
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: app1  #request go to app1 
            port:
              number: 80 # app1 service port

#Without the same group name, AWS creates a separate ALB for each Ingress, increasing cost.
